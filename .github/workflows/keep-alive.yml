name: Keep Alive 24x7

on:
  schedule:
    # Runs every 10 minutes (cron syntax)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live Service Health Endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://rupee-experiment.onrender.com/api/health)
          echo "Render Health Check Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Health check returned $STATUS"
          fi
